name: Publish Server Package

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'server/**'
      - '.github/workflows/publish-server.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (major, minor, patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gabriel403'

      - name: Install dependencies
        run: |
          cd server
          yarn install --frozen-lockfile

      - name: Setup database
        run: |
          cd server
          mkdir -p prisma
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: "file:./prisma/test.db"

      - name: Run tests
        run: |
          cd server
          yarn test --coverage --watchAll=false
        env:
          DATABASE_URL: "file:./prisma/test.db"

      - name: Build
        run: |
          cd server
          yarn build
        env:
          DATABASE_URL: "file:./prisma/test.db"

      - name: Check for package changes
        id: changes
        run: |
          # Check if server files changed since last commit
          # If HEAD~1 doesn't exist (first commit), assume changes exist
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff --quiet HEAD~1 HEAD -- server/ 2>/dev/null; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine version
        id: version
        run: |
          cd server
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          if [ "$BRANCH_NAME" = "main" ]; then
            # Main branch: stable release
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BUMP_TYPE="${{ github.event.inputs.version }}"
              NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version | sed 's/v//')
            else
              # Auto-increment patch for main
              NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/v//')
            fi
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
            # Reset beta counter on stable release
            VERSIONS_FILE=".github/versions.json"
            if [ ! -f "$VERSIONS_FILE" ]; then
              node -e "const fs = require('fs'); fs.writeFileSync('$VERSIONS_FILE', JSON.stringify({server:{betaCounter:0},client:{betaCounter:0}}, null, 2));"
            else
              node -e "const fs = require('fs'); const versions = JSON.parse(fs.readFileSync('$VERSIONS_FILE')); versions.server.betaCounter = 0; fs.writeFileSync('$VERSIONS_FILE', JSON.stringify(versions, null, 2));"
            fi
          else
            # Branch builds: beta release with auto-incrementing counter
            VERSIONS_FILE=".github/versions.json"
            
            # Ensure versions file exists
            if [ ! -f "$VERSIONS_FILE" ]; then
              node -e "const fs = require('fs'); fs.writeFileSync('$VERSIONS_FILE', JSON.stringify({server:{betaCounter:0},client:{betaCounter:0}}, null, 2));"
            fi
            
            # Read current beta counter
            BETA_COUNTER=$(node -p "require('$VERSIONS_FILE').server.betaCounter || 0")
            
            # Increment beta counter
            BETA_COUNTER=$((BETA_COUNTER + 1))
            
            # Update versions file
            node -e "const fs = require('fs'); const versions = JSON.parse(fs.readFileSync('$VERSIONS_FILE')); versions.server.betaCounter = $BETA_COUNTER; fs.writeFileSync('$VERSIONS_FILE', JSON.stringify(versions, null, 2));"
            
            NEW_VERSION="${CURRENT_VERSION}-beta.${BETA_COUNTER}"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "is_beta=true" >> $GITHUB_OUTPUT
            
            # Warn if package contents changed but version wasn't bumped
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "⚠️  Warning: Package contents changed. Consider bumping version in package.json before publishing."
            fi
          fi
          
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Update package.json version
        run: |
          cd server
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = '${{ steps.version.outputs.version }}'; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd server
          if [ "${{ steps.version.outputs.is_beta }}" = "true" ]; then
            npm publish --tag beta
          else
            npm publish --tag latest
          fi

      - name: Commit version files (beta only)
        if: steps.version.outputs.is_beta == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/versions.json server/package.json
          git commit -m "chore(server): bump beta version to ${{ steps.version.outputs.version }}" || exit 0
          git push origin ${{ github.ref_name }} || true

      - name: Create Git tag (main only)
        if: steps.version.outputs.is_beta == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/package.json .github/versions.json
          git commit -m "chore(server): bump version to ${{ steps.version.outputs.version }}" || exit 0
          git tag "server-v${{ steps.version.outputs.version }}"
          git push origin main --tags || true
