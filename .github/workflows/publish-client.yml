name: Publish Client Package

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'client/**'
      - '.github/workflows/publish-client.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (major, minor, patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd client
          yarn install --frozen-lockfile

      - name: Build
        run: |
          cd client
          yarn build

      - name: Determine version
        id: version
        run: |
          cd client
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          if [ "$BRANCH_NAME" = "main" ]; then
            # Main branch: stable release
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              BUMP_TYPE="${{ github.event.inputs.version }}"
              NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version | sed 's/v//')
            else
              # Auto-increment patch for main
              NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/v//')
            fi
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
          else
            # Branch builds: beta release
            BRANCH_SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            NEW_VERSION="${CURRENT_VERSION}-beta.${BRANCH_SANITIZED}.${TIMESTAMP}.${COMMIT_SHORT}"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "is_beta=true" >> $GITHUB_OUTPUT
          fi
          
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Update package.json version
        run: |
          cd client
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = '${{ steps.version.outputs.version }}'; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd client
          if [ "${{ steps.version.outputs.is_beta }}" = "true" ]; then
            npm publish --tag beta
          else
            npm publish --tag latest
          fi

      - name: Create Git tag (main only)
        if: steps.version.outputs.is_beta == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/package.json
          git commit -m "chore(client): bump version to ${{ steps.version.outputs.version }}" || exit 0
          git tag "client-v${{ steps.version.outputs.version }}"
          git push origin main --tags || true
